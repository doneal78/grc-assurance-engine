AWSTemplateFormatVersion: '2010-09-09'
Description: GRC Assurance Engine demo host on Amazon Lightsail

Parameters:
  AdminCidr:
    Type: String
    Description: Your current public IPv4 address in CIDR notation, used only for SSH administration.
    AllowedPattern: ^[0-9]{1,3}(\.[0-9]{1,3}){3}/32$
    ConstraintDescription: Supply one public IPv4 address with a /32 suffix.
  SshKeyName:
    Type: String
    Default: grc-assurance-demo-key
    Description: Name of a Lightsail SSH key pair created separately in this region.
  AppRevision:
    Type: String
    Description: Full 40-character commit SHA to install. Use a commit that contains this pinned bootstrap. Do not pass a branch name.
    AllowedPattern: ^[0-9a-fA-F]{40}$
    ConstraintDescription: Supply the full 40-character commit SHA.
    MinLength: 40
    MaxLength: 40

Resources:
  DemoInstance:
    Type: AWS::Lightsail::Instance
    Properties:
      InstanceName: grc-assurance-engine-demo
      AvailabilityZone: us-east-2a
      BlueprintId: ubuntu_24_04
      BundleId: micro_3_0
      KeyPairName: !Ref SshKeyName
      AddOns:
        - AddOnType: AutoSnapshot
          AutoSnapshotAddOnRequest:
            SnapshotTimeOfDay: '08:00'
      Networking:
        Ports:
          - Protocol: tcp
            FromPort: 22
            ToPort: 22
            AccessDirection: inbound
            AccessFrom: Custom
            AccessType: Public
            Cidrs:
              - !Ref AdminCidr
          - Protocol: tcp
            FromPort: 80
            ToPort: 80
            AccessDirection: inbound
            AccessFrom: Anywhere (0.0.0.0/0)
            AccessType: Public
          - Protocol: tcp
            FromPort: 443
            ToPort: 443
            AccessDirection: inbound
            AccessFrom: Anywhere (0.0.0.0/0)
            AccessType: Public
      # A new stack passes AppRevision into the bootstrap. Changing user data
      # on the existing instance can replace it. Update the running host
      # with the manual runbook in docs/deployment.md instead.
      UserData: !Sub |
        set -eu
        export DEBIAN_FRONTEND=noninteractive
        export GRC_REVISION='${AppRevision}'
        apt-get update
        apt-get install -y ca-certificates curl
        curl -fsSL "https://raw.githubusercontent.com/doneal78/grc-assurance-engine/${!GRC_REVISION}/infra/lightsail-bootstrap.sh" -o /tmp/grc-assurance-bootstrap.sh
        bash /tmp/grc-assurance-bootstrap.sh

  DemoStaticIp:
    Type: AWS::Lightsail::StaticIp
    Properties:
      StaticIpName: grc-assurance-engine-demo-ip
      AttachedTo: !Ref DemoInstance

Outputs:
  PublicIp:
    Description: Static IPv4 address for the demo host
    Value: !GetAtt DemoStaticIp.IpAddress
  InstanceName:
    Value: !Ref DemoInstance
  Domain:
    Value: grc-assurance.davidoneal.dev
