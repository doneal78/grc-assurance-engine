AWSTemplateFormatVersion: '2010-09-09'
Description: GRC Assurance Engine demo host on Amazon Lightsail

Parameters:
  AdminCidr:
    Type: String
    Description: Your current public IPv4 address in CIDR notation, used only for SSH administration.
    AllowedPattern: ^[0-9]{1,3}(\.[0-9]{1,3}){3}/32$
    ConstraintDescription: Supply one public IPv4 address with a /32 suffix.
  SshKeyName:
    Type: String
    Default: grc-assurance-demo-key
    Description: Name of a Lightsail SSH key pair created separately in this region.

Resources:
  DemoInstance:
    Type: AWS::Lightsail::Instance
    Properties:
      InstanceName: grc-assurance-engine-demo
      AvailabilityZone: us-east-2a
      BlueprintId: ubuntu_24_04
      BundleId: micro_3_0
      KeyPairName: !Ref SshKeyName
      AddOns:
        - AddOnType: AutoSnapshot
          AutoSnapshotAddOnRequest:
            SnapshotTimeOfDay: '08:00'
      Networking:
        Ports:
          - Protocol: tcp
            FromPort: 22
            ToPort: 22
            AccessDirection: inbound
            AccessFrom: Custom
            AccessType: Public
            Cidrs:
              - !Ref AdminCidr
          - Protocol: tcp
            FromPort: 80
            ToPort: 80
            AccessDirection: inbound
            AccessFrom: Anywhere (0.0.0.0/0)
            AccessType: Public
          - Protocol: tcp
            FromPort: 443
            ToPort: 443
            AccessDirection: inbound
            AccessFrom: Anywhere (0.0.0.0/0)
            AccessType: Public
      UserData: |
        #!/bin/bash
        set -Eeuo pipefail
        exec > >(tee -a /var/log/grc-assurance-bootstrap.log) 2>&1
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y ca-certificates curl nginx python3-venv python3-pip
        install -d -o ubuntu -g ubuntu /opt/grc-assurance-engine
        curl -fsSL https://api.github.com/repos/doneal78/grc-assurance-engine/tarball/main -o /tmp/grc-assurance-engine.tar.gz
        tar -xzf /tmp/grc-assurance-engine.tar.gz --strip-components=1 -C /opt/grc-assurance-engine
        python3 -m venv /opt/grc-assurance-engine/.venv
        /opt/grc-assurance-engine/.venv/bin/pip install --upgrade pip
        /opt/grc-assurance-engine/.venv/bin/pip install -r /opt/grc-assurance-engine/requirements.txt
        install -d -o ubuntu -g ubuntu -m 0750 /var/lib/grc-assurance
        install -o root -g root -m 0600 /dev/null /etc/grc-assurance-engine.env
        cat > /etc/systemd/system/grc-assurance-engine.service <<'UNIT'
        [Unit]
        Description=GRC Assurance Engine demo web application
        After=network-online.target
        Wants=network-online.target

        [Service]
        User=ubuntu
        Group=ubuntu
        WorkingDirectory=/opt/grc-assurance-engine
        Environment=REQUIRE_AUTH=true
        Environment=DATABASE_PATH=/var/lib/grc-assurance/grc_assurance.sqlite3
        EnvironmentFile=/etc/grc-assurance-engine.env
        ExecStart=/opt/grc-assurance-engine/.venv/bin/gunicorn --workers 2 --bind 127.0.0.1:8000 --access-logfile - run:app
        Restart=on-failure
        RestartSec=5
        NoNewPrivileges=true
        PrivateTmp=true

        [Install]
        WantedBy=multi-user.target
        UNIT
        cat > /etc/nginx/sites-available/grc-assurance-engine <<'NGINX'
        server {
            listen 80 default_server;
            listen [::]:80 default_server;
            server_name grc-assurance-engine.labs.davidoneal.dev;
            location / {
                add_header Retry-After 60 always;
                return 503 "Demo setup in progress. Please try again shortly.\n";
            }
        }
        NGINX
        rm -f /etc/nginx/sites-enabled/default
        ln -sfn /etc/nginx/sites-available/grc-assurance-engine /etc/nginx/sites-enabled/grc-assurance-engine
        nginx -t
        systemctl enable nginx
        systemctl restart nginx
        systemctl daemon-reload
        systemctl enable grc-assurance-engine
        systemctl restart grc-assurance-engine || true
        touch /var/lib/grc-assurance/bootstrap-complete

  DemoStaticIp:
    Type: AWS::Lightsail::StaticIp
    Properties:
      StaticIpName: grc-assurance-engine-demo-ip
      AttachedTo: !Ref DemoInstance

Outputs:
  PublicIp:
    Description: Static IPv4 address for the demo host
    Value: !GetAtt DemoStaticIp.IpAddress
  InstanceName:
    Value: !Ref DemoInstance
  Domain:
    Value: grc-assurance-engine.labs.davidoneal.dev
