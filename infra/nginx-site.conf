# Hosted demo site for grc-assurance.davidoneal.dev.
# Cloudflare proxies public traffic. The origin certificate is a Cloudflare
# Origin CA certificate, trusted only by Cloudflare. Install it before
# enabling this file. See docs/deployment.md.

server_tokens off;

# Rate limits for the public, no-login demo.
# Cloudflare sends each visitor's address in CF-Connecting-IP. Requests
# without that header, such as ones sent straight to the origin, are held
# only by the overall limit.
# /try/ is the public walkthrough. /api/ is an open write path while
# REQUIRE_AUTH is false, because persist can store a synthetic row.
# Both use 20 requests a minute per visitor. Other pages stay at 120.
# Copying this file to the host and reloading Nginx is a separate step.
# The bootstrap does not replace an existing site file, and editing this
# repository file does not change the live host.
limit_req_zone $http_cf_connecting_ip zone=try_per_visitor:10m rate=20r/m;
limit_req_zone $server_name zone=try_total:1m rate=5r/s;
limit_req_zone $http_cf_connecting_ip zone=api_per_visitor:10m rate=20r/m;
limit_req_zone $server_name zone=api_total:1m rate=5r/s;
# The rest of the site is also public, including the forms that save to the
# shared synthetic risk register, so it gets a looser per-visitor limit too.
limit_req_zone $http_cf_connecting_ip zone=site_per_visitor:10m rate=120r/m;
limit_req_zone $server_name zone=site_total:1m rate=10r/s;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name grc-assurance.davidoneal.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grc-assurance.davidoneal.dev;

    ssl_certificate     /etc/ssl/cloudflare/grc-assurance.davidoneal.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/grc-assurance.davidoneal.dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    location /try/ {
        limit_req zone=try_per_visitor burst=10 nodelay;
        limit_req zone=try_total burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        limit_req zone=api_per_visitor burst=10 nodelay;
        limit_req zone=api_total burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        limit_req zone=site_per_visitor burst=40 nodelay;
        limit_req zone=site_total burst=40 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
